openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.5.0
  description: B.K. Textile operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operations overview
  - name: orders
    description: Merchandising orders
  - name: order-files
    description: Private documents and garment images attached to orders
  - name: buyers
    description: Buyers and sourcing agents that issue POs
  - name: order-detail
    description: Order lines, colour x size grid, fabrics and trims
  - name: order-emails
    description: Source emails and attachments linked to an order
  - name: admin
    description: Restricted operations (ADMIN_USER_IDS only)
  - name: work
    description: Department work items
  - name: materials
    description: Material receipts and stock
  - name: quality
    description: Material inspections
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get the operations overview
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: Order not found }
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { description: Order not found }
  /orders/{orderId}/activity:
    get:
      operationId: getOrderActivity
      tags: [orders]
      summary: Get the change history for an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order activity history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderActivity" }
        "404": { description: Order not found }
  /orders/{orderId}/files:
    get:
      operationId: getOrderFiles
      tags: [order-files]
      summary: List files attached to an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Uploaded order files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderFile" }
        "404": { description: Order not found }
  /orders/{orderId}/files/upload-url:
    post:
      operationId: requestOrderFileUpload
      tags: [order-files]
      summary: Request a private upload URL for an order file
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderFileUploadRequest" }
      responses:
        "200":
          description: Upload URL and pending file record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderFileUploadResponse" }
        "400": { description: Invalid file metadata }
        "404": { description: Order not found }
  /orders/{orderId}/files/{fileId}/complete:
    post:
      operationId: completeOrderFileUpload
      tags: [order-files]
      summary: Confirm that an order file upload completed
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stored file metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderFile" }
        "404": { description: Order or pending file not found }
  /orders/{orderId}/files/{fileId}/content:
    get:
      operationId: downloadOrderFile
      tags: [order-files]
      summary: View or download a private order file
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private file content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: Order file not found }
  /orders/{orderId}/files/{fileId}/preview:
    get:
      operationId: previewOrderFile
      tags: [order-files]
      summary: View a private order file inline
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Private file content displayed inline
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: Order file not found }
  /me:
    get:
      operationId: getCurrentUser
      tags: [admin]
      summary: The signed-in user's ID and whether they are an admin
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
  /buyers:
    get:
      operationId: getBuyers
      tags: [buyers]
      summary: List buyers and their invoice abbreviations
      responses:
        "200":
          description: Buyers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Buyer" }
  /orders/{orderId}/breakdown:
    get:
      operationId: getOrderBreakdown
      tags: [order-detail]
      summary: Priced lines, colours and the colour x size grid for an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderBreakdown" }
        "404": { description: Order not found }
  /orders/{orderId}/fabrics:
    get:
      operationId: getOrderFabrics
      tags: [order-detail]
      summary: Fabrics for an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Fabrics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderFabric" }
        "404": { description: Order not found }
  /orders/{orderId}/trims:
    get:
      operationId: getOrderTrims
      tags: [order-detail]
      summary: Trims and accessories for an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Trims
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderTrim" }
        "404": { description: Order not found }
  /orders/{orderId}/emails:
    get:
      operationId: getOrderEmails
      tags: [order-emails]
      summary: Emails linked to an order, newest first, with attachment metadata
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Linked emails
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrderEmail" }
        "404": { description: Order not found }
  /orders/{orderId}/emails/{emailId}:
    get:
      operationId: getOrderEmail
      tags: [order-emails]
      summary: One linked email with its plain-text body
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/EmailId"
      responses:
        "200":
          description: Email detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEmailDetail" }
        "404": { description: Email not linked to this order }
    patch:
      operationId: updateOrderEmail
      tags: [order-emails]
      summary: Confirm or ignore an email link, or correct its category
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/EmailId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderEmailUpdate" }
      responses:
        "200":
          description: Updated email link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderEmail" }
        "404": { description: Email not linked to this order }
  /orders/{orderId}/emails/{emailId}/attachments/{attachmentId}/content:
    get:
      operationId: downloadOrderEmailAttachment
      tags: [order-emails]
      summary: Download an attachment of a linked email
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/EmailId"
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Attachment content
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: Attachment not found }
  /admin/invoice-counter:
    get:
      operationId: getInvoiceCounter
      tags: [admin]
      summary: Current BK invoice counter (admins only)
      responses:
        "200":
          description: Counter state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceCounter" }
        "403": { description: Not an admin }
    put:
      operationId: setInvoiceCounter
      tags: [admin]
      summary: Set the last-used BK invoice number (admins only)
      description: The next new order gets lastNumber + 1. Cannot go below the highest invoice number already on an order.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceCounterUpdate" }
      responses:
        "200":
          description: Updated counter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceCounter" }
        "403": { description: Not an admin }
        "409": { description: Below an invoice number already in use }
  /admin/orders/{orderId}/invoice:
    put:
      operationId: setOrderInvoiceNumber
      tags: [admin]
      summary: Overwrite one order's BK invoice number (admins only)
      description: Rebuilds the reference with the buyer's abbreviation and the year the PO was received. Does not move the counter.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInvoiceUpdate" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { description: Not an admin }
        "404": { description: Order not found }
        "409": { description: "Invoice number already used by another order, or order has no buyer" }
  /admin/orders/{orderId}/reapply-emails:
    post:
      operationId: reapplyOrderEmails
      tags: [admin]
      summary: Re-apply an order's stored emails in their original date order (admins only)
      description: >-
        Re-reads each email matched to the order, corrects its original date
        (e.g. the buyer's date inside a manual forward) and applies its PO and
        trims sheets again from oldest to newest, so the latest email wins.
        Staff edits to the same fields are overwritten; everything is logged.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: What was re-applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReapplyReport" }
        "403": { description: Not an admin }
        "404": { description: Order not found }
  /admin/intake/run:
    post:
      operationId: runEmailIntake
      tags: [admin]
      summary: Read new mail from the orders mailbox now (admins only)
      description: >-
        Reads the mailbox read-only, stores emails about allow-listed POs
        (INTAKE_PO_ALLOWLIST) with their attachments, creates the order for a
        new PO that arrives with its PO sheet, and applies PO and trims sheets
        to the order (later email wins). With dryRun nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeRunRequest" }
      responses:
        "200":
          description: What the run did (or would do)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntakeRunSummary" }
        "403": { description: Not an admin }
        "409": { description: Another run is in progress }
        "503": { description: Mailbox secrets or INTAKE_PO_ALLOWLIST not set }
  /work-items:
    get:
      operationId: getWorkItems
      tags: [work]
      summary: List department work items
      parameters:
        - name: department
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Department" }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/WorkItemStatus" }
      responses:
        "200":
          description: Department work items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkItem" }
  /work-items/{workItemId}:
    patch:
      operationId: updateWorkItem
      tags: [work]
      summary: Update a work item
      parameters:
        - name: workItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkItemUpdate" }
      responses:
        "200":
          description: Updated work item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkItem" }
        "404": { description: Work item not found }
  /materials:
    get:
      operationId: getMaterials
      tags: [materials]
      summary: List received material lots
      responses:
        "200":
          description: Material lots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaterialLot" }
    post:
      operationId: createMaterialLot
      tags: [materials]
      summary: Record a material receipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialLotInput" }
      responses:
        "201":
          description: Created material lot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialLot" }
  /inspections:
    get:
      operationId: getInspections
      tags: [quality]
      summary: List material inspections
      responses:
        "200":
          description: Inspections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Inspection" }
    post:
      operationId: createInspection
      tags: [quality]
      summary: Record a material inspection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InspectionInput" }
      responses:
        "201":
          description: Created inspection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
        "404": { description: Material lot not found }
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmailId:
      name: emailId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OrderStatus:
      type: string
      enum: [draft, development, in_production, ready_to_ship, shipped]
    Priority:
      type: string
      enum: [low, normal, high, urgent]
    Department:
      type: string
      enum: [merchandising, fabrication, sampling, accessories, greige_warehouse, dyed_warehouse, cutting, embellishment, stitching, washing, finishing, packing, export, accounts, admin]
    WorkItemStatus:
      type: string
      enum: [not_started, in_progress, blocked, completed]
    MaterialType:
      type: string
      enum: [yarn, greige_fabric, dyed_fabric, trims]
    MaterialStatus:
      type: string
      enum: [pending_qc, available, hold, rejected]
    InspectionType:
      type: string
      enum: [greige, dyed, trims]
    InspectionResult:
      type: string
      enum: [accepted, hold, rejected]
    Order:
      type: object
      required: [id, reference, buyer, buyerId, invoiceNumber, invoiceRef, poReceivedAt, poIssueDate, endCustomer, priceTerms, paymentTerms, shipVia, countryOfOrigin, overShipTolerancePct, agencyName, previousOrderReference, orderValue, currencyCode, style, quantity, deliveryDate, status, priority, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        buyer: { type: string }
        buyerId: { type: ["string", "null"], format: uuid }
        invoiceNumber: { type: ["integer", "null"], description: "BK invoice number, e.g. 4040" }
        invoiceRef: { type: ["string", "null"], description: "BK invoice reference, e.g. 4040/BK-SAS/2026" }
        poReceivedAt: { type: ["string", "null"], format: date-time }
        poIssueDate: { type: ["string", "null"], format: date }
        endCustomer: { type: ["string", "null"] }
        priceTerms: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"] }
        shipVia: { type: ["string", "null"] }
        countryOfOrigin: { type: ["string", "null"] }
        overShipTolerancePct: { type: ["number", "null"], description: "e.g. 3 for 3% over PO quantity allowed" }
        agencyName: { type: ["string", "null"] }
        previousOrderReference: { type: ["string", "null"] }
        orderValue: { type: ["number", "null"] }
        currencyCode: { type: ["string", "null"] }
        poNumber: { type: ["string", "null"] }
        style: { type: string }
        description: { type: ["string", "null"] }
        quantity: { type: integer }
        deliveryDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/OrderStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderInput:
      type: object
      description: Creating an order assigns the next BK invoice number. A PO number is required. Give buyerId, or a buyer name/abbreviation that matches a known buyer.
      required: [buyer, style, quantity, deliveryDate]
      properties:
        buyer: { type: string, minLength: 1 }
        buyerId: { type: string, format: uuid }
        poReceivedAt: { type: string, format: date-time, description: "Defaults to now; its year goes into the invoice reference" }
        poIssueDate: { type: string, format: date }
        endCustomer: { type: string }
        priceTerms: { type: string }
        paymentTerms: { type: string }
        shipVia: { type: string }
        countryOfOrigin: { type: string }
        overShipTolerancePct: { type: number, minimum: 0, maximum: 100 }
        agencyName: { type: string }
        previousOrderReference: { type: string }
        orderValue: { type: number, minimum: 0 }
        currencyCode: { type: string, minLength: 3, maxLength: 3 }
        poNumber: { type: string }
        style: { type: string, minLength: 1 }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        deliveryDate: { type: string, format: date }
        priority: { $ref: "#/components/schemas/Priority" }
    OrderUpdate:
      type: object
      description: The buyer and BK invoice cannot be changed here (invoice changes go through the admin endpoint).
      properties:
        poIssueDate: { type: ["string", "null"], format: date }
        endCustomer: { type: ["string", "null"] }
        priceTerms: { type: ["string", "null"] }
        paymentTerms: { type: ["string", "null"] }
        shipVia: { type: ["string", "null"] }
        countryOfOrigin: { type: ["string", "null"] }
        overShipTolerancePct: { type: ["number", "null"], minimum: 0, maximum: 100 }
        buyer: { type: string, minLength: 1 }
        agencyName: { type: ["string", "null"] }
        previousOrderReference: { type: ["string", "null"] }
        orderValue: { type: ["number", "null"], minimum: 0 }
        currencyCode: { type: ["string", "null"], minLength: 3, maxLength: 3 }
        poNumber: { type: ["string", "null"] }
        style: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        quantity: { type: integer, minimum: 1 }
        deliveryDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/OrderStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
    OrderActivity:
      type: object
      required: [id, actor, actorId, description, source, action, details, sourceEmailId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        actorId: { type: ["string", "null"] }
        description: { type: string }
        source: { $ref: "#/components/schemas/ActivitySource" }
        action: { type: ["string", "null"], description: "Machine-readable verb, e.g. size_qty.updated" }
        details:
          description: "Structured change data. For field changes: { changes: [{ field, from, to }] }"
          type: ["object", "null"]
          additionalProperties: true
        sourceEmailId: { type: ["string", "null"], format: uuid, description: "Email the change was read from, when source is email_intake" }
        occurredAt: { type: string, format: date-time }
    ActivitySource:
      type: string
      enum: [staff, email_intake, system]
    OrderFile:
      type: object
      required: [id, orderId, fileType, originalName, contentType, sizeBytes, uploadedBy, uploadedByName, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        fileType: { type: string, enum: [document, garment_image] }
        originalName: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        uploadedBy: { type: string }
        uploadedByName: { type: string }
        uploadedAt: { type: string, format: date-time }
    OrderFileUploadRequest:
      type: object
      required: [fileType, name, contentType, sizeBytes]
      properties:
        fileType: { type: string, enum: [document, garment_image] }
        name: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, minLength: 1, maxLength: 100 }
        sizeBytes: { type: integer, minimum: 1, maximum: 26214400 }
    OrderFileUploadResponse:
      type: object
      required: [fileId, uploadURL]
      properties:
        fileId: { type: string, format: uuid }
        uploadURL: { type: string, format: uri }
    CurrentUser:
      type: object
      required: [userId, isAdmin]
      properties:
        userId: { type: string }
        isAdmin: { type: boolean }
    Buyer:
      type: object
      required: [id, name, abbreviation, emailDomains]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        abbreviation: { type: string }
        emailDomains: { type: array, items: { type: string } }
    SizeQuantity:
      type: object
      required: [sizeLabel, sizeSort, quantity]
      properties:
        sizeLabel: { type: string }
        sizeSort: { type: integer }
        quantity: { type: integer }
    Colourway:
      type: object
      required: [id, lineId, code, name, buyerReference, sortOrder, sourceEmailId, sizes, total]
      properties:
        id: { type: string, format: uuid }
        lineId: { type: ["string", "null"], format: uuid }
        code: { type: string }
        name: { type: string }
        buyerReference: { type: ["string", "null"] }
        sortOrder: { type: integer }
        sourceEmailId: { type: ["string", "null"], format: uuid }
        sizes:
          type: array
          description: Only sizes that have a row; missing sizes mean "not on the PO", not zero.
          items: { $ref: "#/components/schemas/SizeQuantity" }
        total: { type: integer }
    OrderLine:
      type: object
      required: [id, styleNumber, description, unitPrice, quantity, sortOrder, sourceEmailId, colourways, gridTotal]
      properties:
        id: { type: string, format: uuid }
        styleNumber: { type: string }
        description: { type: string }
        unitPrice: { type: ["number", "null"] }
        quantity: { type: integer, description: Quantity stated on the PO line }
        sortOrder: { type: integer }
        sourceEmailId: { type: ["string", "null"], format: uuid }
        colourways:
          type: array
          items: { $ref: "#/components/schemas/Colourway" }
        gridTotal: { type: integer, description: Sum of the size grid under this line }
    OrderBreakdown:
      type: object
      required: [orderId, currencyCode, sizeLabels, lines, unassignedColourways, gridTotal, orderQuantity, quantityMismatch]
      properties:
        orderId: { type: string, format: uuid }
        currencyCode: { type: ["string", "null"] }
        sizeLabels:
          type: array
          description: Grid columns in PO order
          items: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        unassignedColourways:
          type: array
          description: Colours not yet placed under a line
          items: { $ref: "#/components/schemas/Colourway" }
        gridTotal: { type: integer }
        orderQuantity: { type: integer }
        quantityMismatch: { type: boolean, description: True when the grid total differs from the order quantity }
    OrderFabric:
      type: object
      required: [id, colourwayId, placement, description, composition, construction, gsm, widthCm, colour, supplier, consumptionPerPiece, consumptionUnit, notes, sourceEmailId, updatedAt]
      properties:
        id: { type: string, format: uuid }
        colourwayId: { type: ["string", "null"], format: uuid, description: Null means all colours }
        placement: { type: string }
        description: { type: string }
        composition: { type: ["string", "null"] }
        construction: { type: ["string", "null"] }
        gsm: { type: ["integer", "null"] }
        widthCm: { type: ["number", "null"] }
        colour: { type: ["string", "null"] }
        supplier: { type: ["string", "null"] }
        consumptionPerPiece: { type: ["number", "null"] }
        consumptionUnit: { type: ["string", "null"] }
        notes: { type: string }
        sourceEmailId: { type: ["string", "null"], format: uuid }
        updatedAt: { type: string, format: date-time }
    TrimType:
      type: string
      enum: [main_label, care_label, size_label, hangtag, button, zip, thread, polybag, carton, other]
    OrderTrim:
      type: object
      required: [id, colourwayId, sizeLabel, trimType, sourceLabel, required, description, supplier, quantityPerPiece, unit, buyerSupplied, notes, sourceEmailId, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceLabel: { type: ["string", "null"], description: "The item as named in the source, e.g. hang tag" }
        required: { type: boolean, description: False when the source says the item is not required }
        colourwayId: { type: ["string", "null"], format: uuid, description: Null means all colours }
        sizeLabel: { type: ["string", "null"] }
        trimType: { $ref: "#/components/schemas/TrimType" }
        description: { type: string }
        supplier: { type: ["string", "null"] }
        quantityPerPiece: { type: ["number", "null"] }
        unit: { type: ["string", "null"] }
        buyerSupplied: { type: boolean }
        notes: { type: string }
        sourceEmailId: { type: ["string", "null"], format: uuid }
        updatedAt: { type: string, format: date-time }
    EmailCategory:
      type: string
      enum: [order_details, tech_pack, trims_accessories, sample_requirements, packaging, amendment, other, unclassified]
    EmailMatchStatus:
      type: string
      enum: [matched, needs_review, ignored]
    EmailMatchMethod:
      type: string
      enum: [po_subject, invoice_ref, thread, po_body_only, manual]
    EmailAttachment:
      type: object
      required: [id, filename, contentType, sizeBytes, isInline, extractStatus, orderFileId]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        isInline: { type: boolean }
        extractStatus: { type: string, enum: [pending, extracted, failed, not_applicable] }
        orderFileId: { type: ["string", "null"], format: uuid, description: Set when the attachment was promoted into the order's files }
    OrderEmail:
      type: object
      required: [id, subject, fromAddress, fromName, sentAt, receivedAt, category, parseStatus, matchStatus, matchMethod, matchReason, matchedAt, attachments]
      properties:
        id: { type: string, format: uuid }
        subject: { type: string }
        fromAddress: { type: string }
        fromName: { type: ["string", "null"] }
        sentAt: { type: ["string", "null"], format: date-time }
        receivedAt: { type: string, format: date-time }
        category: { $ref: "#/components/schemas/EmailCategory" }
        parseStatus: { type: string, enum: [pending, parsed, partial, failed] }
        matchStatus: { $ref: "#/components/schemas/EmailMatchStatus" }
        matchMethod: { $ref: "#/components/schemas/EmailMatchMethod" }
        matchReason: { type: ["string", "null"] }
        matchedAt: { type: string, format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/EmailAttachment" }
    OrderEmailDetail:
      allOf:
        - $ref: "#/components/schemas/OrderEmail"
        - type: object
          required: [toAddresses, ccAddresses, bodyText, parseError]
          properties:
            toAddresses: { type: array, items: { type: string } }
            ccAddresses: { type: array, items: { type: string } }
            bodyText:
              type: ["string", "null"]
              description: Plain text only. Render as text, never as HTML.
            parseError: { type: ["string", "null"] }
    OrderEmailUpdate:
      type: object
      properties:
        matchStatus: { type: string, enum: [matched, ignored] }
        category: { $ref: "#/components/schemas/EmailCategory" }
    InvoiceCounter:
      type: object
      required: [lastNumber, nextNumber, highestUsed]
      properties:
        lastNumber: { type: integer }
        nextNumber: { type: integer }
        highestUsed: { type: ["integer", "null"], description: Highest invoice number on any order }
    InvoiceCounterUpdate:
      type: object
      required: [lastNumber, reason]
      properties:
        lastNumber: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    OrderInvoiceUpdate:
      type: object
      required: [invoiceNumber, reason]
      properties:
        invoiceNumber: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ReapplyReport:
      type: object
      required: [orderId, emails]
      properties:
        orderId: { type: string, format: uuid }
        emails:
          type: array
          items:
            type: object
            required: [emailId, subject, previousDate, originalDate, attachments]
            properties:
              emailId: { type: string, format: uuid }
              subject: { type: string }
              previousDate: { type: ["string", "null"], format: date-time }
              originalDate: { type: ["string", "null"], format: date-time }
              attachments:
                type: array
                items:
                  type: object
                  required: [filename, kind, changes, warnings, skipped]
                  properties:
                    filename: { type: string }
                    kind: { type: string }
                    changes: { type: integer }
                    warnings: { type: array, items: { type: string } }
                    skipped: { type: ["string", "null"] }
    IntakeRunRequest:
      type: object
      required: [dryRun]
      properties:
        dryRun: { type: boolean, description: True to see what would happen without writing anything }
        rescanFromUid: { type: integer, minimum: 1, description: Re-read from this mailbox UID instead of where the last run stopped }
    IntakeEmailReport:
      type: object
      required: [uid, subject, date, outcome, orders, attachments, error]
      properties:
        uid: { type: integer }
        subject: { type: string }
        date: { type: ["string", "null"], format: date-time }
        outcome: { type: string, enum: [stored, would_store, duplicate, not_matched, error] }
        orders:
          type: array
          items:
            type: object
            required: [invoiceRef, poNumber, matchStatus, matchMethod, created]
            properties:
              invoiceRef: { type: ["string", "null"] }
              poNumber: { type: ["string", "null"] }
              matchStatus: { type: string }
              matchMethod: { type: string }
              created: { type: boolean }
        attachments:
          type: array
          items:
            type: object
            required: [filename, kind, changes, warnings, skipped]
            properties:
              filename: { type: string }
              kind: { type: string, description: "po_sheet, trims_sheet, spreadsheet, other or note" }
              changes: { type: integer }
              warnings: { type: array, items: { type: string } }
              skipped: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
    IntakeRunSummary:
      type: object
      required: [dryRun, mailbox, folder, fromUid, scanned, candidates, stored, duplicates, skipped, ordersCreated, emails, errors]
      properties:
        dryRun: { type: boolean }
        mailbox: { type: string }
        folder: { type: string }
        fromUid: { type: integer }
        scanned: { type: integer }
        candidates: { type: integer }
        stored: { type: integer }
        duplicates: { type: integer }
        skipped: { type: integer, description: Messages not about an allow-listed PO; never downloaded or stored }
        ordersCreated: { type: array, items: { type: string } }
        emails:
          type: array
          items: { $ref: "#/components/schemas/IntakeEmailReport" }
        errors: { type: array, items: { type: string } }
    WorkItem:
      type: object
      required: [id, orderId, orderReference, title, department, dueDate, status, priority, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderReference: { type: string }
        title: { type: string }
        department: { $ref: "#/components/schemas/Department" }
        assignee: { type: ["string", "null"] }
        dueDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/WorkItemStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        updatedAt: { type: string, format: date-time }
    WorkItemUpdate:
      type: object
      properties:
        assignee: { type: ["string", "null"] }
        dueDate: { type: string, format: date }
        status: { $ref: "#/components/schemas/WorkItemStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
    MaterialLot:
      type: object
      required: [id, material, type, supplier, lotReference, quantity, unit, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: ["string", "null"], format: uuid }
        orderReference: { type: ["string", "null"] }
        material: { type: string }
        type: { $ref: "#/components/schemas/MaterialType" }
        supplier: { type: string }
        lotReference: { type: string }
        quantity: { type: number }
        unit: { type: string }
        status: { $ref: "#/components/schemas/MaterialStatus" }
        receivedAt: { type: string, format: date }
    MaterialLotInput:
      type: object
      required: [material, type, supplier, lotReference, quantity, unit, receivedAt]
      properties:
        orderId: { type: ["string", "null"], format: uuid }
        material: { type: string, minLength: 1 }
        type: { $ref: "#/components/schemas/MaterialType" }
        supplier: { type: string, minLength: 1 }
        lotReference: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, minLength: 1 }
        receivedAt: { type: string, format: date }
    Inspection:
      type: object
      required: [id, materialId, lotReference, inspectionType, result, defectCount, notes, inspectedAt]
      properties:
        id: { type: string, format: uuid }
        materialId: { type: string, format: uuid }
        lotReference: { type: string }
        inspectionType: { $ref: "#/components/schemas/InspectionType" }
        result: { $ref: "#/components/schemas/InspectionResult" }
        defectCount: { type: integer }
        notes: { type: string }
        inspectedAt: { type: string, format: date-time }
    InspectionInput:
      type: object
      required: [materialId, inspectionType, result, defectCount]
      properties:
        materialId: { type: string, format: uuid }
        inspectionType: { $ref: "#/components/schemas/InspectionType" }
        result: { $ref: "#/components/schemas/InspectionResult" }
        defectCount: { type: integer, minimum: 0 }
        notes: { type: string }
    DepartmentCount:
      type: object
      required: [department, openTasks, overdueTasks]
      properties:
        department: { $ref: "#/components/schemas/Department" }
        openTasks: { type: integer }
        overdueTasks: { type: integer }
    AttentionItem:
      type: object
      required: [id, title, detail, severity, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        orderReference: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    Activity:
      type: object
      required: [id, actor, description, entityType, entityId, occurredAt]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        description: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        occurredAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [activeOrders, dueThisMonth, overdueWork, materialsOnHold, readyToCut, departmentPulse, attentionItems, recentActivity]
      properties:
        activeOrders: { type: integer }
        dueThisMonth: { type: integer }
        overdueWork: { type: integer }
        materialsOnHold: { type: integer }
        readyToCut: { type: integer }
        departmentPulse:
          type: array
          items: { $ref: "#/components/schemas/DepartmentCount" }
        attentionItems:
          type: array
          items: { $ref: "#/components/schemas/AttentionItem" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }

